name: Extension CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate the test fixture deterministically
        run: |
          npm run package:fixture
          sha256sum fixtures/wenku8/wenku8-fixture.hxp fixtures/wenku8/wenku8-fixture.sha256 > "$RUNNER_TEMP/wenku8-fixture.sha256"
          npm run package:fixture
          sha256sum --check --strict "$RUNNER_TEMP/wenku8-fixture.sha256"
